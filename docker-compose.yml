services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
      POSTGRES_DB: skillbridge
    ports:
      # Host 5433 to avoid clashing with an existing local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge -d skillbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://skillbridge:skillbridge@db:5432/skillbridge
      DATABASE_URL_SYNC: postgresql+psycopg://skillbridge:skillbridge@db:5432/skillbridge
      STORAGE_LOCAL_DIR: /app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://skillbridge:skillbridge@db:5432/skillbridge
      DATABASE_URL_SYNC: postgresql+psycopg://skillbridge:skillbridge@db:5432/skillbridge
      STORAGE_LOCAL_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
